name: Refresh GTA 6 view counts and live status
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
concurrency:
  group: vicewire-video-import
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube-metadata.js
      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- videos.json; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'vicewire-import-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json
          git commit -m 'Refresh GTA 6 video stats [automated]'
          git pull --rebase origin main
          git push origin HEAD:main